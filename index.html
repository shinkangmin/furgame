<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비주얼 노벨 엔진 (프로토타입)</title>
<style>
  :root{
    --bg-deep:#161221;
    --panel:#1f1a2e;
    --panel-line:#3a3155;
    --accent:#e0a458;
    --text-main:#f2ece2;
    --text-dim:#a79cc4;
    --name-color:#e0a458;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:#000;
    font-family:'Noto Sans KR', 'Malgun Gothic', sans-serif;
    overflow:hidden;
  }

  #game{
    position:relative;
    width:100vw; height:100vh;
    max-width:960px; max-height:540px;
    margin:auto;
    top:50%; transform:translateY(-50%);
    background:var(--bg-deep);
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6);
  }

  /* 배경 레이어 - 지금은 이미지 없이 그라디언트 placeholder */
  #bg-layer{
    position:absolute; inset:0;
    background:linear-gradient(160deg,#2b2340,#161221 70%);
    transition:background 0.4s ease;
  }

  /* 캐릭터 레이어 - 이미지 들어올 자리 (기존보다 크게, 조금 위로) */
  #char-layer{
    position:absolute;
    bottom:44px; left:50%;
    transform:translateX(-50%);
    width:320px; height:460px;
    display:flex; align-items:flex-end; justify-content:center;
    transition:opacity 0.25s ease;
  }
  #char-layer .char-placeholder{
    width:260px; height:440px;
    border-radius:12px 12px 0 0;
    background:rgba(224,164,88,0.15);
    border:1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    font-size:14px;
    text-align:center;
    padding:12px;
    white-space:pre-line;
  }
  /* 실제 캐릭터 이미지 (charImage가 지정되면 이게 표시되고 placeholder는 숨겨짐) */
  #char-image{
    display:none;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    object-position:bottom center;
  }

  /* 대사창 */
  #dialogue-box{
    position:absolute;
    left:24px; right:24px; bottom:20px;
    background:rgba(31,26,46,0.4); /* 패널 배경만 40% 불투명도 - 뒤의 캐릭터가 비쳐 보이게 함 */
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:18px 22px;
    min-height:120px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    backdrop-filter:blur(3px); /* 글자 가독성 보완용 살짝 블러 */
  }

  #name-tag{
    display:inline-block;
    color:var(--name-color);
    font-weight:700;
    font-size:15px;
    margin-bottom:8px;
    letter-spacing:0.02em;
  }

  #dialogue-text{
    color:var(--text-main);
    font-size:16px;
    line-height:1.6;
    min-height:56px;
    white-space:pre-wrap;
  }

  #next-indicator{
    position:absolute;
    right:18px; bottom:14px;
    color:var(--text-dim);
    font-size:12px;
    animation:blink 1.2s infinite;
  }
  @keyframes blink{ 50%{ opacity:0.2; } }

  /* 대사창 숨기기/보이기 토글 버튼 - 숨긴 상태에서도 항상 보이고 눌러야 함 */
  #toggle-dialogue-btn{
    position:absolute;
    top:8px; right:10px;
    width:26px; height:26px;
    background:rgba(0,0,0,0.35);
    border:1px solid var(--panel-line);
    color:var(--text-dim);
    font-size:13px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:6;
    transition:opacity 0.15s ease, color 0.15s ease;
  }
  #toggle-dialogue-btn:hover{ color:var(--text-main); }
  #toggle-dialogue-btn.off{ opacity:0.55; }

  /* 대사창이 꺼진 상태: 배경/테두리는 투명해지고, 눈 버튼을 제외한 내용은 숨김 */
  #dialogue-box.hidden{
    background:transparent;
    border-color:transparent;
    box-shadow:none;
    backdrop-filter:none;
  }
  #dialogue-box.hidden #name-tag,
  #dialogue-box.hidden #dialogue-text,
  #dialogue-box.hidden #next-indicator,
  #dialogue-box.hidden #restart-btn{
    opacity:0;
    pointer-events:none;
  }

  #restart-btn{
    position:absolute;
    right:18px; bottom:14px;
    background:var(--accent);
    color:#1f1a2e;
    border:none;
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
  }
  #restart-btn:hover{ filter:brightness(1.08); }

  /* 선택지 */
  #choice-layer{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(10,8,16,0.55);
    backdrop-filter:blur(2px);
  }
  #choice-layer.active{ display:flex; }

  .choice-btn{
    background:var(--panel);
    border:1px solid var(--accent);
    color:var(--text-main);
    padding:12px 26px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    min-width:280px;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .choice-btn:hover{
    background:rgba(224,164,88,0.15);
    transform:translateY(-1px);
  }

  /* 상단 툴바 (세이브/로드는 다음 단계에서 채울 자리) */
  #toolbar{
    position:absolute;
    top:10px; right:14px;
    display:flex; gap:8px;
    z-index:5;
  }
  #toolbar button{
    background:rgba(0,0,0,0.35);
    border:1px solid var(--panel-line);
    color:var(--text-dim);
    font-size:12px;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  #toolbar button:hover{ color:var(--text-main); }

  /* 세이브/로드 결과를 알려주는 토스트 메시지 */
  #toast{
    position:absolute;
    top:44px; right:14px;
    z-index:6;
    background:rgba(224,164,88,0.95);
    color:#1f1a2e;
    font-size:12px;
    font-weight:700;
    padding:7px 14px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  #toast.show{ opacity:1; }

  /* 세이브/로드 슬롯 메뉴 */
  #slot-layer{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:rgba(10,8,16,0.7);
    backdrop-filter:blur(2px);
    z-index:10;
  }
  #slot-layer.active{ display:flex; }

  #slot-layer h3{
    color:var(--text-main);
    font-size:15px;
    margin:0 0 6px 0;
    font-weight:700;
  }

  .slot-btn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--text-main);
    padding:10px 20px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    min-width:300px;
    text-align:left;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .slot-btn:hover{
    border-color:var(--accent);
    background:rgba(224,164,88,0.12);
  }
  .slot-btn .slot-title{
    display:block;
    color:var(--accent);
    font-weight:700;
    margin-bottom:3px;
  }
  .slot-btn .slot-desc{
    display:block;
    color:var(--text-dim);
    font-size:12px;
  }
  .slot-btn.empty{
    cursor:default;
    opacity:0.55;
  }
  .slot-btn.empty:hover{
    border-color:var(--panel-line);
    background:var(--panel);
  }

  #slot-cancel{
    margin-top:8px;
    background:none;
    border:1px solid var(--panel-line);
    color:var(--text-dim);
    padding:7px 18px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  #slot-cancel:hover{ color:var(--text-main); }

  /* 설정 메뉴 */
  #settings-layer{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:rgba(10,8,16,0.7);
    backdrop-filter:blur(2px);
    z-index:10;
  }
  #settings-layer.active{ display:flex; }
  #settings-layer h3{
    color:var(--text-main);
    font-size:15px;
    margin:0;
    font-weight:700;
  }
  .settings-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--text-main);
    padding:12px 20px;
    border-radius:8px;
    font-size:13px;
    min-width:260px;
    cursor:pointer;
  }
  .settings-row input{ cursor:pointer; }
  #settings-close{
    margin-top:4px;
    background:none;
    border:1px solid var(--panel-line);
    color:var(--text-dim);
    padding:7px 18px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  #settings-close:hover{ color:var(--text-main); }

  /* 개발용 디버그 패널: 현재 flags(호감도 등) 확인용. 설정에서 토글 (기본값: 꺼짐) */
  #debug-panel{
    display:none;
    position:absolute;
    top:10px; left:14px;
    z-index:5;
    background:rgba(0,0,0,0.4);
    border:1px solid var(--panel-line);
    color:var(--text-dim);
    font-size:11px;
    padding:6px 10px;
    border-radius:6px;
    font-family:monospace;
    white-space:pre;
  }
</style>
</head>
<body>

<div id="game">
  <div id="bg-layer"></div>

  <div id="char-layer">
    <img id="char-image" src="" alt="">
    <div class="char-placeholder" id="char-placeholder">캐릭터 이미지 자리<br>(나중에 교체)</div>
  </div>

  <div id="toolbar">
    <button id="btn-settings">설정</button>
    <button id="btn-save">세이브</button>
    <button id="btn-load">로드</button>
  </div>

  <div id="toast"></div>

  <div id="debug-panel"></div>

  <div id="dialogue-box">
    <button id="toggle-dialogue-btn" title="대사창 숨기기">👁</button>
    <div id="name-tag"></div>
    <div id="dialogue-text"></div>
    <div id="next-indicator">▼ 클릭하여 계속</div>
    <button id="restart-btn" style="display:none;">처음부터 다시</button>
  </div>

  <div id="choice-layer"></div>

  <div id="slot-layer">
    <h3 id="slot-title"></h3>
    <div id="slot-list"></div>
    <button id="slot-cancel">닫기</button>
  </div>

  <div id="settings-layer">
    <h3>설정</h3>
    <label id="toggle-affection-row" class="settings-row">
      <input type="checkbox" id="toggle-affection">
      <span>호감도 수치 표시 (테스트용)</span>
    </label>
    <button id="settings-close">닫기</button>
  </div>
</div>

<script>
/* ============================================================
   1. 스크립트 데이터 구조
   - id: 씬 내 줄 고유 식별자 (분기/저장 시 사용)
   - speaker: 화자 이름 (없으면 나레이션)
   - text: 대사 내용
   - bg: 배경 설명용 라벨 (실제 이미지 없을 때 보여줄 이름표, 필수 아님)
   - bgImage: 실제 배경 이미지 경로/URL (예: "images/bg/classroom.jpg"). 있으면 이 이미지가 표시되고, 없으면 bg 라벨과 함께 placeholder 그라디언트가 표시됨
   - char: 등장 캐릭터 이름 (placeholder 박스에 표시될 이름표, 없으면 캐릭터 숨김)
   - charImage: 실제 캐릭터 이미지 경로/URL (예: "images/char/mystery_girl_normal.png"). 있으면 이 이미지가 표시되고, 없으면 char 이름이 적힌 placeholder 박스가 표시됨
   - choices: 선택지 배열 [{ text, next, onSelect }]
   - next: 다음으로 이동할 id (없으면 자동으로 다음 줄)
   ============================================================ */

const script = [
  {
    id: "start_1",
    speaker: null,
    text: "조용한 교실, 창밖으로 노을이 진다.",
    bg: "classroom_sunset"
  },
  {
    id: "start_2",
    speaker: "???",
    text: "...아직도 남아있었네.",
    char: "mystery_girl"
  },
  {
    id: "start_3",
    speaker: "나",
    text: "어, 미안. 정리하다가 시간 가는 줄 몰랐어.",
    char: "mystery_girl",
    next: "choice_0"
  },

  /* ---------- 새로 추가: 첫인상 선택지 ---------- */
  {
    id: "choice_0",
    speaker: null,
    text: "그녀에게 어떻게 반응할지 고민된다.",
    char: "mystery_girl",
    choices: [
      { text: "웃으며 인사한다", flag: "greet_smile", effects: { affection: 2 }, next: "reaction_0" },
      { text: "무뚝뚝하게 지나친다", flag: "greet_cold", effects: { affection: -2 }, next: "reaction_0" }
    ]
  },
  {
    id: "reaction_0",
    speaker: "???",
    // 조건부 대사: 이전 선택(호감도)에 따라 반응이 달라짐
    text: (flags) => flags.affection >= 2
      ? "어, 반갑게 인사해주네. 고마워."
      : "...(약간 서운한 표정으로 시선을 피한다)",
    char: "mystery_girl",
    next: "choice_1"
  },

  {
    id: "choice_1",
    speaker: null,
    text: "그녀가 잠시 나를 바라본다.",
    char: "mystery_girl",
    choices: [
      // effects: 선택 시 flags 값을 증감시킴 (호감도 등)
      { text: "무슨 일이야?", flag: "path_curious", effects: { affection: 2 }, next: "path_curious_1" },
      { text: "먼저 갈게.", flag: "path_leave", effects: { affection: -1 }, next: "path_leave_1" }
    ]
  },

  /* ---------- '무슨 일이야?' 루트 ---------- */
  {
    id: "path_curious_1",
    speaker: "???",
    text: "그냥... 너한테 할 말이 있었어.",
    char: "mystery_girl",
    next: "choice_2"
  },
  {
    id: "choice_2",
    speaker: "나",
    // text를 함수로 주면 flags 값에 따라 대사가 달라짐 (조건부 대사)
    text: (flags) => flags.affection >= 2
      ? "천천히 말해도 돼. 시간 많으니까."
      : "무슨 얘긴데?",
    char: "mystery_girl",
    choices: [
      { text: "손을 잡아준다", flag: "brave", effects: { affection: 2 }, next: "path_brave" },
      { text: "가만히 기다린다", flag: "wait", effects: { affection: 1 }, next: "path_wait" },
      // showIf: 이전 선택(affection 누적)이 조건을 만족할 때만 이 선택지가 보임
      {
        text: "[호감도 2] 예전부터 신경 쓰였어",
        flag: "confess",
        effects: { affection: 3 },
        showIf: (flags) => flags.affection >= 2,
        next: "path_confess"
      }
    ]
  },
  {
    id: "path_brave",
    speaker: "???",
    text: "...!  (놀란 눈으로 너를 본다)",
    char: "mystery_girl",
    next: "choice_3"
  },
  {
    id: "path_wait",
    speaker: "???",
    text: "...고마워, 기다려줘서.",
    char: "mystery_girl",
    next: "choice_3"
  },
  {
    id: "path_confess",
    speaker: "???",
    text: "...나도, 사실은.",
    char: "mystery_girl",
    next: "choice_3"
  },
  {
    id: "choice_3",
    speaker: "나",
    // 지금까지 쌓인 호감도에 따라 분위기 묘사가 달라짐
    text: (flags) => flags.affection >= 5
      ? "표정이 한결 편안해 보인다. 조금 더 다가가볼까."
      : "묘하게 어색한 공기가 흐른다.",
    char: "mystery_girl",
    choices: [
      { text: "장난스럽게 웃어 보인다", flag: "joke", effects: { affection: 1 }, next: "to_ending" },
      { text: "어색하게 화제를 돌린다", flag: "deflect", effects: { affection: -1 }, next: "to_ending" },
      // 호감도가 충분히 쌓였을 때만 등장하는 선택지
      {
        text: "[호감도 3] 진지하게 바라본다",
        flag: "serious",
        effects: { affection: 2 },
        showIf: (flags) => flags.affection >= 3,
        next: "to_ending"
      }
    ]
  },

  /* ---------- '먼저 갈게' 루트 ---------- */
  {
    id: "path_leave_1",
    speaker: "???",
    text: "아... 그래, 그럼 다음에 얘기하자.",
    char: "mystery_girl",
    next: "leave_choice_2"
  },
  {
    id: "leave_choice_2",
    speaker: null,
    text: "몇 발자국 걷다가, 문득 마음에 걸린다.",
    choices: [
      { text: "다시 돌아가서 사과한다", flag: "apologize", effects: { affection: 3 }, next: "leave_apologize" },
      { text: "그냥 간다", flag: "just_leave", effects: { affection: -2 }, next: "leave_ignore" }
    ]
  },
  {
    id: "leave_apologize",
    speaker: "???",
    text: "...괜찮아, 그렇게 신경 쓰지 않아도 돼. 그래도 돌아와줘서 고마워.",
    char: "mystery_girl",
    next: "to_ending"
  },
  {
    id: "leave_ignore",
    speaker: null,
    text: "뒤도 돌아보지 않고 교실을 나섰다.",
    next: "to_ending"
  },

  /* ---------- 엔딩 분기 ----------
     선택지 없이도 next를 함수로 주면 누적된 flags 값을 보고
     자동으로 다른 씬(엔딩)으로 이동시킬 수 있음
     (선택지가 늘어나 호감도 범위가 대략 -6 ~ +9까지 나올 수 있어 기준값을 조정함) */
  {
    id: "to_ending",
    speaker: null,
    text: "시간이 흐른다...",
    next: (flags) => {
      if (flags.affection >= 6) return "ending_good";
      if (flags.affection >= 0) return "ending_neutral";
      return "ending_bad";
    }
  },
  {
    id: "ending_good",
    speaker: null,
    text: "[GOOD ENDING] 둘 사이의 거리가 눈에 띄게 가까워졌다.",
    char: "mystery_girl",
    end: true
  },
  {
    id: "ending_neutral",
    speaker: null,
    text: "[NEUTRAL ENDING] 특별할 것 없는 하루가 지나갔다.",
    end: true
  },
  {
    id: "ending_bad",
    speaker: null,
    text: "[BAD ENDING] 그녀는 조용히 교실을 떠났다.",
    end: true
  }
];

/* ============================================================
   2. 게임 상태
   ============================================================ */
const state = {
  currentId: script[0].id,
  flags: {
    affection: 0     // 호감도 - 선택지의 effects로 증감됨
  },
  history: []        // 지나온 id 기록 (되돌리기/로그용, 지금은 뼈대만)
};

/* ============================================================
   3. DOM 참조
   ============================================================ */
const nameTag = document.getElementById("name-tag");
const dialogueText = document.getElementById("dialogue-text");
const dialogueBox = document.getElementById("dialogue-box");
const toggleDialogueBtn = document.getElementById("toggle-dialogue-btn");
const bgLayer = document.getElementById("bg-layer");
const charLayer = document.getElementById("char-layer");
const charImageEl = document.getElementById("char-image");
const charPlaceholder = document.getElementById("char-placeholder");
const choiceLayer = document.getElementById("choice-layer");
const nextIndicator = document.getElementById("next-indicator");
const restartBtn = document.getElementById("restart-btn");
const debugPanel = document.getElementById("debug-panel");
const toast = document.getElementById("toast");
const slotLayer = document.getElementById("slot-layer");
const slotTitle = document.getElementById("slot-title");
const slotList = document.getElementById("slot-list");
const slotCancel = document.getElementById("slot-cancel");
const settingsLayer = document.getElementById("settings-layer");
const toggleAffection = document.getElementById("toggle-affection");
const settingsClose = document.getElementById("settings-close");

// 설정값 (호감도 표시 여부 등). localStorage에 저장해서 다음에 열어도 유지됨
const SETTINGS_KEY = "vn_prototype_settings";

function loadSettings(){
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(raw) return Object.assign({ showAffection: false }, JSON.parse(raw));
  } catch(err){
    console.error("설정 불러오기 실패:", err);
  }
  return { showAffection: false }; // 기본값: 숨김
}

function persistSettings(){
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch(err){
    console.error("설정 저장 실패:", err);
  }
}

const settings = loadSettings();

function applyDebugPanelVisibility(){
  debugPanel.style.display = settings.showAffection ? "block" : "none";
}

// 현재 flags 값을 화면에 표시 (설정에서 켰을 때만 보임)
function updateDebugPanel(){
  const entries = Object.entries(state.flags)
    .map(([k, v]) => `${k}: ${v}`)
    .join("\n");
  debugPanel.textContent = "[flags]\n" + (entries || "(없음)");
}

/* ============================================================
   4. 핵심 함수
   ============================================================ */

function findLineById(id){
  return script.find(line => line.id === id);
}

// text가 문자열이면 그대로, 함수면 flags를 넣어 실행한 결과를 반환 (조건부 대사)
function resolveText(value, flags){
  return typeof value === "function" ? value(flags) : value;
}

// next/choice.next가 문자열이면 그대로, 함수면 flags를 넣어 실행한 결과를 반환 (조건부 분기)
function resolveNext(value, flags){
  return typeof value === "function" ? value(flags) : value;
}

function renderLine(line){
  // 이름
  nameTag.textContent = line.speaker || "";
  nameTag.style.display = line.speaker ? "inline-block" : "none";

  // 배경: bgImage가 있으면 실제 이미지, 없으면 기존처럼 그라디언트 placeholder
  if(line.bgImage){
    bgLayer.style.backgroundImage = `url("${line.bgImage}")`;
    bgLayer.style.backgroundSize = "cover";
    bgLayer.style.backgroundPosition = "center";
  } else if(line.bg){
    bgLayer.style.backgroundImage = "none";
    bgLayer.style.background =
      "linear-gradient(160deg, #2b2340, #161221 70%)"; // TODO: bg별 실제 이미지가 없을 때의 기본 placeholder
  }

  // 캐릭터: charImage가 있으면 실제 이미지, 없으면 이름이 적힌 placeholder 박스
  if(line.char || line.charImage){
    charLayer.style.opacity = 1;
    if(line.charImage){
      charImageEl.src = line.charImage;
      charImageEl.style.display = "block";
      charPlaceholder.style.display = "none";
    } else {
      charImageEl.style.display = "none";
      charPlaceholder.style.display = "flex";
      charPlaceholder.textContent = line.char + "\n(이미지 자리)";
    }
  } else {
    charLayer.style.opacity = 0;
  }

  // 대사 타이핑 효과 (조건부 대사 지원)
  typeText(resolveText(line.text, state.flags));

  // 선택지 처리 (showIf 조건을 만족하는 선택지만 필터링)
  const visibleChoices = (line.choices || []).filter(
    choice => !choice.showIf || choice.showIf(state.flags)
  );

  if(visibleChoices.length > 0){
    showChoices(visibleChoices);
    nextIndicator.style.display = "none";
    restartBtn.style.display = "none";
  } else if(line.end){
    // 엔딩 도달: 계속 진행 대신 다시 시작 버튼을 보여줌
    hideChoices();
    nextIndicator.style.display = "none";
    restartBtn.style.display = "block";
  } else {
    hideChoices();
    nextIndicator.style.display = "block";
    restartBtn.style.display = "none";
  }

  updateDebugPanel();
}

let typing = false;
let typeTimer = null;

function typeText(text){
  clearInterval(typeTimer);
  dialogueText.textContent = "";
  typing = true;
  let i = 0;
  typeTimer = setInterval(() => {
    dialogueText.textContent += text[i];
    i++;
    if(i >= text.length){
      clearInterval(typeTimer);
      typing = false;
    }
  }, 25);
}

function skipTyping(){
  clearInterval(typeTimer);
  const line = findLineById(state.currentId);
  dialogueText.textContent = resolveText(line.text, state.flags);
  typing = false;
}

function showChoices(choices){
  choiceLayer.innerHTML = "";
  choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = choice.text;
    btn.addEventListener("click", () => selectChoice(choice));
    choiceLayer.appendChild(btn);
  });
  choiceLayer.classList.add("active");
}

function hideChoices(){
  choiceLayer.classList.remove("active");
  choiceLayer.innerHTML = "";
}

function selectChoice(choice){
  if(choice.flag){
    state.flags[choice.flag] = true; // 어떤 선택을 했는지 기록 (나중에 조건 분기용)
  }

  // effects: { affection: 2 } 처럼 여러 수치를 한번에 증감
  if(choice.effects){
    Object.entries(choice.effects).forEach(([key, delta]) => {
      state.flags[key] = (state.flags[key] || 0) + delta;
    });
  }

  hideChoices();
  goToLine(resolveNext(choice.next, state.flags));
}

function goToLine(id){
  state.history.push(state.currentId);
  state.currentId = id;
  renderLine(findLineById(id));
}

function advance(){
  const line = findLineById(state.currentId);

  // 타이핑 중이면 즉시 완성
  if(typing){
    skipTyping();
    return;
  }

  // 엔딩(end:true)이면 여기서 멈춤 - 더 이상 다음 줄로 넘어가지 않음
  if(line.end){
    return;
  }

  // 선택지가 떠 있으면 클릭으로 넘어가지 않음
  if(line.choices && line.choices.length > 0){
    return;
  }

  // 다음 줄 결정: next가 지정돼 있으면 그쪽으로(문자열이든 조건부 함수든), 없으면 배열상 다음 줄
  if(line.next){
    goToLine(resolveNext(line.next, state.flags));
  } else {
    const idx = script.findIndex(l => l.id === state.currentId);
    if(idx >= 0 && idx + 1 < script.length){
      goToLine(script[idx + 1].id);
    } else {
      dialogueText.textContent = "(대사 끝)";
    }
  }
}

/* ============================================================
   5. 이벤트 연결
   ============================================================ */
dialogueBox.addEventListener("click", advance);

// 씬을 방해받지 않고 구경할 수 있도록 대사창을 숨겼다 켰다 하는 토글
let dialogueHidden = false;
toggleDialogueBtn.addEventListener("click", (e) => {
  e.stopPropagation(); // 이 클릭이 dialogueBox의 advance()로 번지지 않게 막음
  dialogueHidden = !dialogueHidden;
  dialogueBox.classList.toggle("hidden", dialogueHidden);
  toggleDialogueBtn.classList.toggle("off", dialogueHidden);
  toggleDialogueBtn.title = dialogueHidden ? "대사창 보이기" : "대사창 숨기기";
});

document.addEventListener("keydown", (e) => {
  if(e.code === "Space" || e.code === "Enter"){
    e.preventDefault();
    advance();
  }
});

// 세이브/로드는 localStorage에 슬롯 3개로 저장 (브라우저에 남으므로 새로고침해도 유지됨)
const SAVE_KEY_PREFIX = "vn_prototype_save_slot_";
let toastTimer = null;
let slotMode = "save"; // "save" 또는 "load" - 어떤 목적으로 메뉴를 열었는지 기억

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1800);
}

function readSlot(i){
  const raw = localStorage.getItem(SAVE_KEY_PREFIX + i);
  if(!raw) return null;
  try {
    return JSON.parse(raw);
  } catch(err){
    return null;
  }
}

function writeSlot(i, data){
  localStorage.setItem(SAVE_KEY_PREFIX + i, JSON.stringify(data));
}

// 슬롯 목록에 보여줄 요약 텍스트 (호감도 + 현재 대사 일부 + 저장 시각)
function buildSlotSummary(data){
  if(!data) return "비어있음";
  const line = findLineById(data.currentId);
  const rawText = line ? resolveText(line.text, data.flags) : "";
  const snippet = rawText.length > 22 ? rawText.slice(0, 22) + "..." : rawText;
  const when = data.savedAt ? new Date(data.savedAt).toLocaleString() : "";
  const affection = data.flags && typeof data.flags.affection === "number" ? data.flags.affection : 0;
  return `호감도 ${affection} · ${snippet}  (${when})`;
}

function openSlotMenu(mode){
  slotMode = mode;
  slotTitle.textContent = mode === "save" ? "저장할 슬롯을 선택하세요" : "불러올 슬롯을 선택하세요";
  slotList.innerHTML = "";

  for(let i = 1; i <= 3; i++){
    const data = readSlot(i);
    const isEmptyForLoad = mode === "load" && !data;

    const btn = document.createElement("button");
    btn.className = "slot-btn" + (isEmptyForLoad ? " empty" : "");

    const titleSpan = document.createElement("span");
    titleSpan.className = "slot-title";
    titleSpan.textContent = `슬롯 ${i}`;

    const descSpan = document.createElement("span");
    descSpan.className = "slot-desc";
    descSpan.textContent = buildSlotSummary(data);

    btn.appendChild(titleSpan);
    btn.appendChild(descSpan);

    if(!isEmptyForLoad){
      btn.addEventListener("click", () => handleSlotClick(i));
    }
    slotList.appendChild(btn);
  }

  slotLayer.classList.add("active");
}

function closeSlotMenu(){
  slotLayer.classList.remove("active");
}

function handleSlotClick(i){
  if(slotMode === "save"){
    saveToSlot(i);
  } else {
    loadFromSlot(i);
  }
  closeSlotMenu();
}

function saveToSlot(i){
  const data = {
    currentId: state.currentId,
    flags: state.flags,
    history: state.history,
    savedAt: Date.now()
  };
  try {
    writeSlot(i, data);
    showToast(`슬롯 ${i}에 저장되었습니다.`);
  } catch(err){
    console.error("저장 실패:", err);
    showToast("저장에 실패했습니다.");
  }
}

function loadFromSlot(i){
  const data = readSlot(i);
  if(!data){
    showToast("빈 슬롯입니다.");
    return;
  }
  try {
    state.currentId = data.currentId;
    state.flags = data.flags || { affection: 0 };
    state.history = data.history || [];
    renderLine(findLineById(state.currentId));
    showToast(`슬롯 ${i}를 불러왔습니다.`);
  } catch(err){
    console.error("불러오기 실패:", err);
    showToast("불러오기에 실패했습니다.");
  }
}

document.getElementById("btn-save").addEventListener("click", () => openSlotMenu("save"));
document.getElementById("btn-load").addEventListener("click", () => openSlotMenu("load"));
slotCancel.addEventListener("click", closeSlotMenu);

document.getElementById("btn-settings").addEventListener("click", () => {
  toggleAffection.checked = settings.showAffection;
  settingsLayer.classList.add("active");
});
settingsClose.addEventListener("click", () => {
  settingsLayer.classList.remove("active");
});
toggleAffection.addEventListener("change", () => {
  settings.showAffection = toggleAffection.checked;
  persistSettings();
  applyDebugPanelVisibility();
});

function restartGame(){
  state.currentId = script[0].id;
  state.flags = { affection: 0 };
  state.history = [];
  renderLine(findLineById(state.currentId));
}

restartBtn.addEventListener("click", (e) => {
  e.stopPropagation(); // 대사창 클릭(advance)으로 이벤트가 번지지 않도록
  restartGame();
});

/* ============================================================
   6. 시작
   ============================================================ */
applyDebugPanelVisibility();
renderLine(findLineById(state.currentId));

</script>
</body>
</html>
